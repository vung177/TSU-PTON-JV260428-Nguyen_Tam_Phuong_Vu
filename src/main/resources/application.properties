spring.application.name=finalexammodule4

# Cấu hình Hibernate tự sinh bảng và in SQL ra console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kết nối Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ProductManagementDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Giới hạn kích thước file tải lên
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB